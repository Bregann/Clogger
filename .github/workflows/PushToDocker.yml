name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "CloggerApp/**"

jobs:
  build-and-publish:
    # Any self-hosted runner: the PC or Unraid, whichever is free
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f Clogger/Clogger.Api/Dockerfile -t 192.168.1.100:5000/cloggerapi:latest ./Clogger

      - name: Push Docker image
        run: docker push 192.168.1.100:5000/cloggerapi:latest
